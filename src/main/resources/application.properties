spring.application.name=api
server.port=${PORT:8081}
server.address=0.0.0.0

# Database Configuration (PostgreSQL - Railway & Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:retrobolsa_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:retrobolsa_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:retrobolsa_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration (Optional)
spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}

# Configuração do JWT
# JWT_SECRET é obrigatório via variável de ambiente (sem valor padrão) para evitar
# que um segredo conhecido publicamente no repositório seja usado em produção.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Origens permitidas para CORS (separadas por vírgula). Adicione a origem de
# produção do frontend via CORS_ALLOWED_ORIGINS quando fizer o deploy.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:19006}

retrobolsa.lifecycle.interval-ms=60000

# Quantas rodadas consecutivas formam uma temporada (ranking type=season).
retrobolsa.ranking.season-size=${RANKING_SEASON_SIZE:4}

# Actuator: apenas health/info expostos publicamente (sem detalhes sensiveis).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# O Redis nao e usado por nenhum ponto da aplicacao. Sem esta linha, o indicador
# de saude dele fica DOWN em ambientes sem Redis e derruba /actuator/health para
# 503, reprovando o healthcheck de deploy mesmo com a API funcionando.
management.health.redis.enabled=false
