spring.application.name=api
server.port=${PORT:8081}
server.address=0.0.0.0

# Database Configuration (PostgreSQL - Railway & Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:retrobolsa_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:retrobolsa_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:retrobolsa_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration (Optional)
spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}

# Configuração do JWT
jwt.secret=${JWT_SECRET:b3da5df6b77d2de9304852e72a078d2566794cdb2ebf93e4eb02c6f2eb25b086}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Opcional: promove um usuário existente a ADMIN no startup.
retrobolsa.admin.email=retroadm@gmail.com
retrobolsa.lifecycle.interval-ms=60000
